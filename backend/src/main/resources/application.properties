spring.application.name=muro-notas

# Versión de la aplicación: Maven la copia aquí desde el pom.xml al compilar
app.version=@project.version@

# --- Base de datos (todo llega por variables de entorno) ---
# DB_HOST y DB_PASSWORD no tienen valor por defecto: si faltan, la aplicación no arranca
# (lo comprueba MuroNotasApplication antes de iniciar Spring).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:muronotas}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Si la BD no responde, rendirse a los 3 segundos (por defecto son 30)
# para que /api/estado conteste rápido con "bd":"error".
spring.datasource.hikari.connection-timeout=3000

# Hibernate crea o actualiza la tabla "notas" al arrancar.
# Cómodo para aprender; en un proyecto real se usaría Flyway o Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
