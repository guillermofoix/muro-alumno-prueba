# Perfil "local": para ejecutar el programa en tu PC sin instalar ninguna base de datos.
# Se activa con el perfil de Spring "local" (ver README). Sin este perfil no se usa nada de este fichero.

# H2 en memoria: los datos se pierden al parar el programa
spring.datasource.url=jdbc:h2:mem:muronotas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Spring sirve también la web (frontend/index.html) para ver todo en http://localhost:8080
# con /api en el mismo origen. La ruta es relativa a la carpeta desde la que se ejecuta:
# la primera vale si se ejecuta desde backend/ y la segunda si se hace desde la raíz del repositorio.
spring.web.resources.static-locations=file:../frontend/,file:./frontend/
